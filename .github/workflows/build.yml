name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm install

      - name: Download frida-server (arm64)
        run: |
          FRIDA_VERSION="16.3.3"
          wget -q "https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-server-${FRIDA_VERSION}-android-arm64.xz" -O frida-server.xz
          xz -d frida-server.xz
          mv frida-server android/app/src/main/assets/frida-server-arm64
          echo "frida-server size: $(wc -c < android/app/src/main/assets/frida-server-arm64) bytes"

      - name: Download frida-gadget (arm64)
        run: |
          FRIDA_VERSION="16.3.3"
          wget -q "https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gadget-${FRIDA_VERSION}-android-arm64.so.xz" -O frida-gadget.xz
          xz -d frida-gadget.xz
          mv frida-gadget.so android/app/src/main/assets/frida-gadget-arm64.so
          echo "frida-gadget size: $(wc -c < android/app/src/main/assets/frida-gadget-arm64.so) bytes"

      - name: Download apktool
        run: |
          wget -q "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" -O android/app/src/main/assets/apktool.jar
          echo "apktool size: $(wc -c < android/app/src/main/assets/apktool.jar) bytes"

      - name: Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true

      - name: Bundle JS
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FridaCtl-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Show APK info
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          echo "APK size: $(du -sh $APK | cut -f1)"
