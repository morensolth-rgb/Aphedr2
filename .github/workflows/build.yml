name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🔥 مهم: يثبت node_modules بشكل صحيح
      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm install

      # 🔥 مهم جدًا: يمنع مشاكل Gradle/Kotlin
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Create assets directory
        run: mkdir -p android/app/src/main/assets

      - name: Download frida-server (arm64)
        run: |
          set -e
          FRIDA_VERSION="16.3.3"

          curl -L -o frida-server.xz \
            "https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-server-${FRIDA_VERSION}-android-arm64.xz"

          xz -d frida-server.xz

          SERVER_FILE=$(find . -maxdepth 1 -type f | grep frida-server | head -n 1)

          cp "$SERVER_FILE" android/app/src/main/assets/frida-server-arm64
          chmod +x android/app/src/main/assets/frida-server-arm64

      - name: Download frida-gadget (arm64)
        run: |
          set -e
          FRIDA_VERSION="16.3.3"

          curl -L -o frida-gadget.xz \
            "https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gadget-${FRIDA_VERSION}-android-arm64.so.xz"

          xz -d frida-gadget.xz || true

          GADGET_FILE=$(find . -maxdepth 1 -type f | grep -E 'gadget|\.so$' | head -n 1)

          cp "$GADGET_FILE" android/app/src/main/assets/frida-gadget-arm64.so

      - name: Download apktool
        run: |
          curl -L \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" \
            -o android/app/src/main/assets/apktool.jar

      - name: Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true

      - name: Bundle JS
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      # 🔥 إصلاح مهم: يمنع Kotlin Isolation errors
      - name: Clean Gradle
        run: cd android && ./gradlew clean

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FridaCtl-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Show APK info
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK" ]; then
            echo "APK size: $(du -sh $APK | cut -f1)"
          fi
